name: CI

# Type-check, lint and build every pull request (incl. Dependabot) and push to main.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["public/data/**", "data/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Data file is valid
        run: node -e 'const j=require("./public/data/facilities.json"); if(!(j.facilities?.length>1000)) throw new Error("facilities.json looks broken")'
