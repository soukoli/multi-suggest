name: Update facility data

# Free daily pipeline: GitHub Actions refreshes public/data/facilities.json and commits it;
# Vercel redeploys automatically on the push. A failed run opens a GitHub issue.
on:
  schedule:
    - cron: "15 2 * * *" # daily 02:15 UTC
  workflow_dispatch:
    inputs:
      scrape:
        description: "Refetch MultiSport partner data (otherwise only OSM opening hours)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Scrape MultiSport partners (whole CZ)
        if: ${{ github.event_name == 'schedule' || inputs.scrape }}
        run: node scripts/scrape.mjs

      - name: Opening hours from OpenStreetMap
        run: node scripts/enrich-osm.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/facilities.json
          git diff --staged --quiet && { echo "No changes"; exit 0; }
          git commit -m "data: refresh facilities ($(date -u +%F))"
          git pull --rebase
          git push

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Data update failed"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
