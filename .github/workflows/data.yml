name: Update facility data

# Free daily pipeline (GitHub Actions → commit → Vercel redeploys):
#   1. MultiSport partners for the whole CZ (daily)
#   2. OSM extract from Geofabrik → data/osm-pois.json (Sundays, or on demand)
#   3. Opening hours matched from that cache (daily, offline)
# Security: the scrape evaluates MultiSport's third-party auth.js, so it runs in a job with a
# read-only token and no persisted git credentials. Only the publish job can push.
# Problems open or comment on a "Data update failed" / "Data update warning" issue.
on:
  schedule:
    - cron: "15 2 * * *" # daily 02:15 UTC
  workflow_dispatch:
    inputs:
      scrape:
        description: "Refetch MultiSport partner data"
        type: boolean
        default: true
      full:
        description: "Refetch ALL details (~35 min) instead of new + 1/7 rotation (~5 min)"
        type: boolean
        default: false
      osm:
        description: "Rebuild the OpenStreetMap extract (opening hours)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      osm: ${{ steps.osm.outcome }}
      enrich: ${{ steps.enrich.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Decide what to refresh
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "scrape=true" >> "$GITHUB_OUTPUT"
            [ "$(date -u +%u)" = "7" ] && echo "osm=true" >> "$GITHUB_OUTPUT" || echo "osm=false" >> "$GITHUB_OUTPUT"
          else
            echo "scrape=${{ inputs.scrape }}" >> "$GITHUB_OUTPUT"
            echo "osm=${{ inputs.osm }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape MultiSport partners (whole CZ)
        if: steps.plan.outputs.scrape == 'true'
        run: node scripts/scrape.mjs ${{ inputs.full && '--full' || '' }}

      - name: Rebuild OpenStreetMap extract
        id: osm
        if: steps.plan.outputs.osm == 'true'
        continue-on-error: true # opening hours are optional; never lose a fresh scrape
        timeout-minutes: 30
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          ./scripts/osm-refresh.sh

      - name: Match opening hours
        id: enrich
        continue-on-error: true
        run: node scripts/enrich-osm.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            public/data/facilities.json
            data/osm-pois.json
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: .
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/facilities.json
          if [ -f data/osm-pois.json ]; then git add data/osm-pois.json; fi
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: refresh facilities ($(date -u +%F))"
          git push

  report:
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update an issue on problems
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          build="${{ needs.build.result }}"; publish="${{ needs.publish.result }}"
          osm="${{ needs.build.outputs.osm }}"; enrich="${{ needs.build.outputs.enrich }}"
          if [ "$build" != "success" ] || [ "$publish" != "success" ]; then
            title="Data update failed"; body="build: $build, publish: $publish — $RUN"
          elif [ "$osm" = "failure" ] || [ "$enrich" = "failure" ]; then
            title="Data update warning"; body="Data published, but opening hours step failed (osm: $osm, enrich: $enrich) — $RUN"
          else
            echo "All good"; exit 0
          fi
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
